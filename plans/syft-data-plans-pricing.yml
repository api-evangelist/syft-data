credit_model:
  version: '2.2'
  effective: '2026-05-11'
  source: https://docs.syftdata.com/pricing
  principle: One entity, one charge per month.
  activation_credits:
    - entity: Activated Contact — first-party
      cost_credits: 1
      when: You action a known person discovered via your own signals (form fills, logins, LinkedIn interactions, CSV enrichment).
    - entity: Activated Contact — de-anonymized
      cost_credits: 5
      when: You action a person Syft identified from anonymous traffic.
    - entity: Activated Account
      cost_credits: 1
      when: You action a company that has no contacts activated in that month.
  signal_credits:
    - signal: RB2B Contact Identification add-on
      cost_credits: 2
      unit: per unique contact per month
      when: A unique visitor is identified via the RB2B add-on, on every identification.
  rules:
    - No double charging between company and contact in the same month; a prior account charge is applied toward the contact.
    - Credits reset monthly on the billing date and do not roll over.
    - Credits are non-refundable.
    - Signal Credits and Activation Credits are independent of each other.
  monitoring: https://app.syftdata.com/dashboard/settings/billing
trial:
  free_trial: false
  note: >-
    No published free tier. The signup flow is advertised as "No credit card ·
    ~10 min setup"; the Agency tier includes a trial workspace for self-evaluation.
