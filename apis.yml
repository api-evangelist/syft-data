aid: syft-data
name: Syft Data
description: >-
  Syft Data, Inc. is a B2B lead-intelligence platform that identifies and
  qualifies high-intent prospects from inbound website traffic and LinkedIn
  engagement. Its tracking pixel reveals anonymous visitors, enriches contacts,
  scores them against an Ideal Customer Profile, and triggers multi-channel
  outreach ("motions") into CRM, email, LinkedIn, and ad platforms. For
  developers Syft ships a schema-driven analytics SDK and CLI (npm @syftdata/*),
  a server-side Lookup and Export REST API secured with sk_live_ keys, outbound
  webhooks, and an official hosted MCP server so AI agents can query visitor data
  and build automations from chat.
