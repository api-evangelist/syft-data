api: Syft Data Lookup & Export API
limit_count: 0
note: >-
  Syft publishes NO request-rate limits for the Lookup API, the Export API or the
  hosted MCP server — no per-key/per-account ceiling, no window, no burst, and no
  documented 429 behaviour. Probed live 2026-08-13: an anonymous POST to
  /api/syft/lookup and a bad-key GET to /api/motion/{id}/export both return 401
  with no RateLimit-*, X-RateLimit-* or Retry-After header, so there is no runtime
  signal an agent can back off on either. What Syft DOES meter is monthly credit
  consumption (a billing quota, not a rate limit) plus two per-response result
  caps. Recorded as an honest zero.
