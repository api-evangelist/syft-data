api: Syft Data
summary: >-
  Syft's agent surface is far wider than its REST surface. The hosted MCP server
  publishes 18 tools spanning discovery, GTM configuration, motion execution and
  workspace admin; the public REST contract is 2 operations. Only two tools have a
  documented REST equivalent — the rest are MCP-only, backed by the private app
  API. Confidence is set from the docs' own tool descriptions: the live MCP
  schemas could not be read (tools/list returns 401 invalid_token without OAuth),
  so no inputSchema is asserted here.
