  openapi:
    - file: openapi/syft-data-lookup-api-openapi.yml
      base: https://app.syftdata.com/api
      gated: false
      note: Lookup API is in alpha and access-gated to select customers, but the contract is public.
    - file: openapi/syft-data-export-api-openapi.yml
      base: https://app.syftdata.com/api
      gated: false
  mcp:
    url: https://app.syftdata.com/api/mcp
    transport: http
    gated: true
    probe:
      method: tools/list
      status: 401
      body: '{"error":"invalid_token","error_description":"No authorization provided"}'
      www_authenticate: resource_metadata=https://app.syftdata.com/.well-known/oauth-protected-resource
      checked: '2026-08-13'
    plan_gate: Pro plan required.
  graphql: null
